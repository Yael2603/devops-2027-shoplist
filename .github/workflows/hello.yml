name: Hello
on: push

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Who am I, and where?
        run: |
          echo "Repo:   $GITHUB_REPOSITORY"
          docker --version
          python3 --version

      - name: Get the code
        uses: actions/checkout@v6

      - name: What is in the repo?
        run: ls
